name: Deploy dev-path1

on:
  push:
    branches:
      - dev-path1
  workflow_dispatch:

concurrency:
  group: deploy-dev-path1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to dev-path1
    if: github.ref_name == 'dev-path1'
    runs-on: ubuntu-latest
    environment:
      name: dev-path1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check voiceflow
        run: python -m compileall -q voiceflow

      - name: Package app
        run: |
          mkdir -p dist
          tar --exclude='__pycache__' --exclude='*.pyc' -czf dist/voiceflow-dev-path1.tar.gz voiceflow

      - name: Upload dev-path1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceflow-dev-path1
          path: dist/voiceflow-dev-path1.tar.gz
          if-no-files-found: error
