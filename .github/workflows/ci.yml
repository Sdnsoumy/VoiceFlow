name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-check voiceflow
        run: python -m compileall -q voiceflow

      - name: Load default config
        working-directory: voiceflow
        run: |
          python -c "from config import load_config; cfg = load_config(); assert cfg['hotkey']; print('config ok')"

      - name: Run dependency-free smoke test
        run: python voiceflow/test_no_hotkey.py
